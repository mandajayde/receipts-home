name: site
# Pages source must be set to GitHub Actions in the repository settings, or the deploy step fails until it is.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/validate.py
      - if: github.event_name == 'pull_request'
        run: git fetch origin main && python3 tools/guard.py origin/main
      - run: python3 tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
